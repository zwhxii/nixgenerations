
# MangoWM config — converted from hyprland.conf
# Docs: https://mangowm.github.io/docs
# ############################################################


# ##################
# ### MONITORS   ###
# ##################

# DP-1: 2560x1440 @ 240Hz, primary, VRR on
monitorrule=name:^DP-1$,width:2560,height:1440,refresh:240,x:0,y:0,scale:1,vrr:1
tagrule = id:1-5,monitor_name:^DP-1$,layout_name:scroller

# HDMI-A-1: 1920x1080 @ 75Hz, offset to the right (vertically centred relative to DP-1)
monitorrule=name:^HDMI-A-1$,width:1920,height:1080,refresh:75,x:2560,y:250,scale:1,vrr:0
tagrule = id:6-9,monitor_name:^HDMI-A-1$,layout_name:scroller


# ##################
# ### AUTOSTART  ###
# ##################

exec-once=swaybg -i ~/Pictures/mal01.png -m fill   
exec-once=waybar
exec-once=easyeffects

# ############################
# ### ENVIRONMENT VARIABLES ###
# ############################

env=XCURSOR_THEME,aosp-cursors
env=XCURSOR_SIZE,24
cursor_size=24
cursor_theme=aosp-cursors


# ##################
# ### THEMING    ###
# ##################

# Borders & gaps (hyprland: gaps_in=5, gaps_out=20, border_size=3)
borderpx=3
gappih=5
gappiv=5
gappoh=20
gappov=20

# Border colors (converted from RGBA hex to 0xRRGGBBAAff)
# active:   rgba(643e4aff) → 0x643e4aff
# inactive: rgba(595959aa) → 0x595959aa
focuscolor=0x643e4aff
bordercolor=0x595959aa

# No rounded corners (rounding=0 in hyprland)
border_radius=0

# Opacity (hyprland active/inactive both 1.0)
focused_opacity=1.0
unfocused_opacity=1.0


# ##################
# ### EFFECTS    ###
# ##################

# Blur (hyprland: enabled, size=3, passes=1)
blur=1
blur_params_radius=3
blur_params_num_passes=1

# Shadows (hyprland: enabled, range=4, color rgba(1a1a1aee))
shadows=1
shadow_only_floating=1
shadows_size=4
shadows_blur=4
shadowscolor=0x1a1a1aee


# ######################
# ### ANIMATIONS     ###
# ######################

animations=0
layer_animations=1

# Open: easeOutQuint feel — snappy ease-out
animation_type_open=zoom
animation_type_close=slide
layer_animation_type_open=slide
layer_animation_type_close=slide

# Durations (scaled from Hyprland's speed values)
animation_duration_open=210     # ~4.79 speed → ~210ms
animation_duration_close=670    # ~1.49 speed → ~670ms
animation_duration_move=500
animation_duration_tag=515      # ~1.94 speed → ~515ms

# Bezier curves
# easeOutQuint: 0.23,1,0.32,1
animation_curve_open=0.23,1.0,0.32,1.0
animation_curve_move=0.23,1.0,0.32,1.0
animation_curve_tag=0.5,0.5,0.75,1.0
animation_curve_close=0.0,0.0,1.0,1.0

# Fade
animation_fade_in=1
animation_fade_out=1
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.87


# ##################
# ### LAYOUT     ###
# ##################

# Hyprland used dwindle layout
# Mango equivalent: dwindle
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle


# ##################
# ### INPUT      ###
# ##################

xkb_rules_layout=us,ru
xkb_rules_options=grp:win_space_toggle

# Mouse (follow_mouse=1 → focus follows pointer)
mouse_accel_speed=0.0

# Touchpad natural scroll off
trackpad_natural_scrolling=0


# ######################
# ### WINDOW RULES   ###
# ######################

# Fix unfocused XWayland floating windows stealing focus
windowrule=no_focus,appid:^$,title:^$


# ######################
# ### KEYBINDINGS   ###
# ######################

# --- Apps ---
bind=SUPER,Q,spawn,kitty
bind=SUPER,E,spawn,thunar
bind=SUPER,R,spawn,rofi -show drun

# Launch several apps at once (mirrors the original SUPER+SHIFT+CTRL+A multi-bind)
bind=SUPER+SHIFT+CTRL,A,spawn,discord
bind=SUPER+SHIFT+CTRL,A,spawn,flatpak run org.telegram.desktop
bind=SUPER+SHIFT+CTRL,A,spawn,steam
bind=SUPER+SHIFT+CTRL,A,spawn,spotify

# --- Window management ---
bind=SUPER,C,killclient
bind=SUPER,M,quit
bind=SUPER,V,togglefloating
#bind=SUPER,J,swap_split

# --- Focus with arrow keys ---
bind=SUPER,left,focusdir,left
bind=SUPER,right,focusdir,right
bind=SUPER,up,focusdir,up
bind=SUPER,down,focusdir,down

# --- Move windows with arrow keys ---
bind=SUPER+SHIFT,left,exchange_client,left
bind=SUPER+SHIFT,right,exchange_client,right
bind=SUPER+SHIFT,up,exchange_client,up
bind=SUPER+SHIFT,down,exchange_client,down

# --- Switch tags (workspaces 1–9) ---
bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

# --- Move window to tag ---
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# --- Scratchpad (special workspace equivalent) ---
bind=SUPER,S,toggle_scratchpad
bind=SUPER+SHIFT,S,minimized

# --- Mouse drag: move / resize ---
# (mousebind syntax: mousebind=MOD,BUTTON,ACTION)
mousebind=SUPER,btn_right,moveresize,curresize   
mousebind=SUPER,btn_left,moveresize,curmove   

# --- Volume ---
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# --- Brightness ---
bind=NONE,XF86MonBrightnessUp,spawn,brightnessctl -e4 -n2 set 5%+
bind=NONE,XF86MonBrightnessDown,spawn,brightnessctl -e4 -n2 set 5%-

# --- Media ---
bindl=NONE,XF86AudioNext,spawn,playerctl next
bindl=NONE,XF86AudioPause,spawn,playerctl play-pause
bindl=NONE,XF86AudioPlay,spawn,playerctl play-pause
bindl=NONE,XF86AudioPrev,spawn,playerctl previous

# --- Screenshot (region → clipboard) ---
bind=CTRL,Print,spawn,/home/whixie/.config/mango/snip.sh

# --- Config reload ---
bind=SUPER,F5,reload_config



